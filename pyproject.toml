[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qgraphrag"
version = "0.1.0"
description = "Quality-aware graph retrieval-augmented generation for multi-hop question answering"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Junchen Wu"}]
dependencies = [
  "torch>=2.4,<3", "numpy>=1.24,<2", "PyYAML>=6,<7",
  "openai>=1.52,<3", "sentence-transformers>=3.2,<6",
  "rank-bm25>=0.2.2,<0.3", "pcst-fast>=1.0.10,<2", "tqdm>=4.66,<5"
]

[project.optional-dependencies]
data = ["datasets>=3,<5", "gdown>=5,<6"]
dev = ["pytest>=8,<10", "ruff>=0.9", "build>=1.2"]

[project.scripts]
qgraphrag = "qgraphrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
